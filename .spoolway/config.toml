# Full reference: docs/configuration.md
#
# Key                                   Values               Default                                                 Meaning
# dispatch.backend                      herdr, headless      herdr                                                   Where lanes run: a real pane you can watch. `headless` is spoolway's own test backend, refused unless SPOOLWAY_TEST_BACKEND is set.
# dispatch.lane_quiet                   <duration>           15m                                                     How long a lane may say nothing before the dispatcher reminds it to report. Not how often a pass looks — the dispatcher polls at a fixed rate nobody sets.
# dispatch.auto_commit                  true, false          true                                                    Whether spoolway commits a lane's leftover work when its step settles.
# dispatch.priority                     group, any           group                                                   Whether a free slot is filled from every ready task, or from the group already landing first.
# dispatch.lane_child_ceiling           <duration>           1h                                                      How long a lane may be excused for a process it started that is still running before the reminder loop treats it as silent anyway.
# dispatch.keep_finished_lanes          true, false          true                                                    Whether a finished step's agent stays open in its own pane until its task is done, or each new step takes over the last one's place.
# unattended.enabled                    true, false          false                                                   Whether this run stops for a person, or resumes every block itself with `max_output_tokens` as the only brake.
# unattended.max_output_tokens          <tokens>             0                                                       Output tokens one unattended run may spend before the dispatcher stops starting work; 0 is no ceiling.
# unattended.max_cost_usd               <dollars>            0                                                       Dollars one unattended run may spend before the dispatcher stops starting work, priced from the resolved model table; 0 is no ceiling.
# unattended.blocked_agent              <profile>            claude                                                  Which `[agents.*]` profile staffs `blocked` in an unattended run, for every pipeline that does not declare its own `blocked` step.
# unattended.blocked_model              <model>              claude-opus-5                                           The model that profile runs, staffing `blocked`. Blank refuses to start an unattended run: nobody would be able to clear a block.
# unattended.blocked_effort             <level>              (blank)                                                 How hard that model thinks, staffing `blocked`.
# unattended.blocked_session            true, false          true                                                    Whether the lane staffing `blocked` carries its own earlier session forward.
# unattended.blocked_prompt             <name>               unblocker                                               Prompt the lane staffing `blocked` runs.
# housekeeping.update_check             true, false          true                                                    Whether spoolway tells a person at a keyboard that a newer release is out.
# housekeeping.calibrate_window         <duration>           14d                                                     How far back `spoolway-calibrate` reads: archived tasks finished inside the window, and the ledger entries beside them.
# housekeeping.retention_days           <days>               30                                                      How long system-prompts/, commands/, tracking/, headless/ (its logs/ included) and scratch/ keep an entry before it is deleted; 0 keeps everything forever. archive/ is governed by housekeeping.archive_retention_days instead. queue/, pending/, worktrees/ and plans/ are never swept.
# housekeeping.archive_retention_days   <days>               0                                                       How long a finished task keeps its file in archive/ before it is deleted, along with its line in archive/index.jsonl; 0 keeps every finished task forever. Each task is about 25 KB. A deleted task can no longer be named in `depends_on`, and falls out of what `spoolway eval` and `calibrate_window` read.
# housekeeping.price_max_age_days       <days>               30                                                      How old the active shared price table may be before `spoolway doctor` says so; 0 disables the note.
# watch.dirs                            <path>, ...          (empty)                                                 Directories whose own sessions are counted beside the lanes. The project root is always watched; these are extra. Absolute, or ~-relative.
# issue_tracking.hook                   <filename>           (blank)                                                 A bare filename, resolved inside `.spoolway/hooks/` (a home-mode workspace's own `config/hooks/`); blank runs no hook and changes nothing about a task's `queued`, `blocked`, `paused` or `done`.
# issue_tracking.project_key            <string>             (blank)                                                 Opaque to spoolway — `owner/repo` on github, a project key on jira — handed to the hook verbatim as `SPOOLWAY_PROJECT_KEY`.
# issue_tracking.key_in_names           true, false          true                                                    Whether a `slug=` the hook answers prefixes the group, branch and worktree name `queue add` generates — `task/<slug>-<id>`. With no hook, or a blank `hook`, there is no `slug=` to prefix with, so this changes nothing either way.
# agents.<profile>.kind                 <agent kind>         one per shipped profile                                 Which agent binary this profile launches.
# agents.<profile>.concurrency          <n>                  unset — omitted means no cap                            Most lanes of this profile running at once; 0 is unlimited. A cap on the harness — a local model's own count is `models.<glob>.slots`.
# agents.<profile>.session_reuse_ctx    0, 1..=100           0                                                       How large a carried session may be, as a percentage of the model's context window, before a fresh one opens instead; 0 is off.
# agents.<profile>.session_blocked_ctx  0, 1..=100           0                                                       Percentage of the model's context window a *running* lane's last turn may reach before the dispatcher stops it and blocks the task; 0 is off. Must be above `session_reuse_ctx` when both are nonzero. The reading is only taken at turn boundaries, so the ceiling can be overshot.
# agents.<profile>.permission_mode      <mode>               the kind's own first mode (absent on a kind with none)  Which approval mode this profile's lanes are started with. Absent on a kind that has none.
# models.<glob>.context_window          <tokens>             0 (unset)                                               What one session of this model gets to work in. `session_reuse_ctx` and `session_blocked_ctx` take their percentage of it, so a session step against a model with this unset never reuses or blocks on size.
# models.<glob>.input                   <USD per 1M tokens>  0                                                       Cost per million input tokens.
# models.<glob>.output                  <USD per 1M tokens>  0                                                       Cost per million output tokens.
# models.<glob>.cache_read              <USD per 1M tokens>  0                                                       Cost per million cached tokens read.
# models.<glob>.cache_write_5m          <USD per 1M tokens>  0                                                       Cost per million tokens written to a 5-minute cache.
# models.<glob>.cache_write_1h          <USD per 1M tokens>  0                                                       Cost per million tokens written to a 1-hour cache.
# models.<glob>.prompt_cache_ttl        <duration>           5m (none if local)                                      How long a session's prompt cache is trusted to stay warm. A resume past it opens a fresh session. "0" turns it off.
# models.<glob>.slots                   <n>                  0                                                       How many lanes this model may run at once, replacing its profile's `concurrency`; 0 leaves the profile in charge.
# models.<glob>.exclusive               true, false          false                                                   Whether this model refuses to run alongside a different `exclusive` one — one set of weights on the card at a time.
# models.<glob>.local                   true, false          false                                                   Whether this model runs on hardware you own. Setting it on a model that carries `slots` or `exclusive` silences doctor's note that it should probably say so. It also removes the 5m `prompt_cache_ttl` default from this model.

[dispatch]
backend = "herdr"
lane_quiet = "15m"
auto_commit = true

[unattended]
enabled = true
max_output_tokens = 0
max_cost_usd = 0.0
blocked_agent = "claude"
blocked_model = "claude-opus-5-5"
blocked_effort = "medium"
blocked_session = true
blocked_prompt = "unblocker"

[housekeeping]
update_check = true
calibrate_window = "14d"
retention_days = 30
archive_retention_days = 0
price_max_age_days = 30

[watch]
# Directories whose own sessions are counted beside the lanes. The project
# root is always watched; these are extra. Absolute, or ~-relative.
dirs = []

[issue_tracking]
hook = "jira.sh"
project_key = "KAN"
key_in_names = true

[agents.claude]
kind = "claude"
concurrency = 3
session_reuse_ctx = 20
session_blocked_ctx = 40
permission_mode = "auto"

[agents.codex]
kind = "codex"
concurrency = 3
session_reuse_ctx = 40
session_blocked_ctx = 0
permission_mode = "never"

[agents.pi]
kind = "pi"
session_reuse_ctx = 40
session_blocked_ctx = 0

[models."Ornith-1.5-35B-A3B"]
context_window = 100096
slots = 2
exclusive = true
local = true
