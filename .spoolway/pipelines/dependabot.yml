# Full reference: docs/pipelines.md

description: >-
  Review open Dependabot pull requests with an AI agent, merge the safe ones
  behind the required checks, and put a bugfix task on the queue screen for
  the ones that need code changes.

steps:
  # A command step, so a run with nothing new to review ends here without
  # starting an agent.
  - id: check
    description: Go on to the review only when a Dependabot pull request has not been reviewed at its current head.
    run: scripts/dependabot-pending.sh
    timeout: 5m
    hide: true
    on_pass: review
    on_fail: done

  - id: review
    description: Give every open Dependabot pull request a verdict — merge, hold or fix — and write a bugfix task for each fix.
    agent: claude
    prompt: dependency-reviewer
    model: claude-opus-5-5
    effort: high
    on_pass: merge

  # A command step, so Claude Code's auto mode never sees the merge, and so
  # every approval is checked again by rules no review can talk its way past.
  # It also hands each fix's task to the pending directory: spoolway refuses
  # `queue add` in every lane, so a person sends it from the queue screen.
  - id: merge
    description: Re-check every approval, post each verdict as a comment, turn on auto-merge for the approved pull requests, and put each fix's bugfix task on the queue screen.
    run: scripts/dependabot-merge.sh
    timeout: 15m
    hide: true
    on_pass: done
