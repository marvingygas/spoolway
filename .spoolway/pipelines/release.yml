# Full reference: docs/pipelines.md

description: >-
  Release spoolway end to end: prepare one release pull request, then merge,
  tag, publish and verify it, and land the upgrade fixture, with nobody waiting
  on a merge button.

steps:
  - id: prepare
    description: Make main releasable, pick the version, write the changelog and open one green release pull request.
    agent: claude
    prompt: releaser
    model: claude-opus-5-5
    effort: high
    on_pass: ship

  # A command step, so Claude Code's auto mode never sees the merge or the tag
  # push. It refused both when an agent did them.
  - id: ship
    description: Rehearse, merge, tag and publish the release pull request, then verify what npm and GitHub serve.
    run: scripts/release-ship.sh
    timeout: 4h
    on_pass: fixture

  - id: fixture
    description: Scaffold the released version's upgrade fixture from its own tag and auto-merge its pull request.
    run: scripts/release-fixture.sh
    timeout: 30m
    on_pass: done
