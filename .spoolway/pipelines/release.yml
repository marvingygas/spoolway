# Full reference: docs/pipelines.md

description: >-
  Cut a spoolway release — bump the version, commit the approved changelog
  section, rehearse the build, tag it, and verify what npm and GitHub actually
  ended up with.

task_template: default

steps:
  - id: preflight
    description: Prove main is releasable, and assemble the diff, pull requests, contributors and changelog state for the next version.
    agent: pi
    prompt: release-preflight
    model: ornith/Ornith-1.5-35B-A3B
    session: true
    loop:
      publish: 1
    on_loop_max: blocked
    on_pass: notes
    on_fail: blocked

  - id: notes
    description: Write the one approved changelog section that ships as the entry, the embedded notes and the release body.
    agent: claude
    prompt: release-notes
    model: claude-opus-5
    effort: high
    session: true
    gate: true
    on_pass: publish
    on_fail: blocked

  - id: publish
    description: Commit the section with the version bump, rehearse, tag, publish, and verify the published body against it.
    agent: claude
    prompt: release-publisher
    model: claude-opus-5
    effort: high
    on_pass: done
    on_fail: preflight
