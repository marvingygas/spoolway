# Full reference: docs/pipelines.md

description: >-
  Make main release-ready, repair and merge any blockers, then cut, publish and
  verify a spoolway release without waiting for a person.

task_template: default

steps:
  - id: ready
    description: Prove clean main passes the complete local and hosted release-readiness suite.
    agent: claude
    prompt: release-readiness
    model: claude-opus-5
    effort: high
    session: true
    loop:
      fix: 3
    on_loop_max: blocked
    on_pass: preflight
    on_fail: fix

  # Gated, because this step no longer merges. `main` is protected and every pull
  # request is gated on `ci`, so the repair lands when the owner merges it — and
  # an ungated pass would hand a readiness run the same `main` it just failed on,
  # which re-finds the identical blocker and spends a lap of the loop doing it.
  # The pause is where the merge happens.
  - id: fix
    description: Repair every readiness blocker in one pull request and hand its number to the owner to merge.
    agent: codex
    prompt: release-fixer
    model: gpt-5.6-sol
    effort: high
    gate: true
    on_pass: ready
    on_fail: ready

  - id: preflight
    description: Freeze the release candidate and assemble its diff, pull requests, contributors, version and changelog state.
    agent: claude
    prompt: release-preflight
    model: claude-opus-5
    effort: high
    session: true
    loop:
      fix: 3
    on_loop_max: blocked
    on_pass: notes
    on_fail: fix

  - id: notes
    description: Write the one recorded changelog section that ships as the entry, the embedded notes and the release body.
    agent: claude
    prompt: release-notes
    model: claude-sonnet-5
    effort: high
    session: true
    gate: true
    loop:
      notes: 2
    on_loop_max: blocked
    on_pass: publish
    on_fail: notes

  - id: publish
    description: Commit the section with the version bump, rehearse, tag, publish, and verify the published body against it.
    agent: codex
    prompt: release-publisher
    model: gpt-5.6-sol
    effort: high
    loop:
      preflight: 1
    on_loop_max: blocked
    on_pass: released
    on_fail: preflight

  - id: released
    description: Prove the tag, the seven packages, the archives and the published body actually exist.
    run: scripts/release-verify.sh
    timeout: 15m
    on_pass: done
