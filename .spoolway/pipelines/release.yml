# Full reference: docs/pipelines.md

description: >-
  Make main release-ready, suggest the next version for a person to approve or
  override, then cut, publish and verify the release.

task_template: default

steps:
  - id: ready
    description: Prove clean main passes the complete local and hosted release-readiness suite.
    agent: claude
    prompt: release-readiness
    model: claude-opus-5
    effort: high
    session: true
    loop: 2
    on_pass: version
    on_fail: fix

  - id: fix
    description: Repair every release blocker in one pull request and drive its checks green.
    agent: claude
    prompt: release-fixer
    model: claude-opus-5
    effort: high
    session: true
    loop: 2
    on_pass: merge-fix

  - id: merge-fix
    description: Independently review the repair, correct its existing branch if needed, and merge it.
    agent: claude
    prompt: release-merger
    model: claude-opus-5
    effort: high
    on_pass: ready

  - id: version
    description: Recommend the next version and pause for a person's approval or override.
    agent: claude
    prompt: release-version
    model: claude-opus-5
    effort: high
    gate: true
    loop: 2
    on_pass: preflight
    on_fail: ready

  - id: preflight
    description: Freeze the chosen release version and assemble its diff, pull requests, contributors and changelog state.
    agent: claude
    prompt: release-preflight
    model: claude-opus-5
    effort: high
    session: true
    on_pass: notes
    on_fail: fix

  - id: notes
    description: Write and validate the changelog section that ships everywhere.
    agent: claude
    prompt: release-notes
    model: claude-sonnet-5
    effort: high
    session: true
    on_pass: candidate

  - id: candidate
    description: Build the exact four-file release commit and open one green pull request for it.
    agent: claude
    prompt: release-candidate
    model: claude-opus-5
    effort: high
    on_pass: merge-release
    on_fail: version

  - id: merge-release
    description: Independently review and merge the exact release commit without changing its candidate.
    agent: claude
    prompt: release-merger
    model: claude-opus-5
    effort: high
    on_pass: publish
    on_fail: version

  - id: publish
    description: Rehearse the merged release commit, tag it, publish it, and verify every public artifact.
    agent: claude
    prompt: release-publisher
    model: claude-opus-5
    effort: high
    on_pass: released
    on_fail: version

  - id: released
    description: Prove the tag, the six packages, the archives and the published body actually exist.
    run: scripts/release-verify.sh
    timeout: 15m
    on_pass: fixture
    on_fail: repair-released

  - id: repair-released
    description: Repair a failed post-publication verification in one green pull request.
    agent: claude
    prompt: release-fixer
    model: claude-opus-5
    effort: high
    session: true
    loop: 2
    on_pass: merge-released-repair

  - id: merge-released-repair
    description: Review and merge the post-publication verifier repair, then rerun the verifier.
    agent: claude
    prompt: release-merger
    model: claude-opus-5
    effort: high
    on_pass: released

  # The closing step of docs/releasing.md, which was prose nobody was gated on
  # until 0.4.0 shipped without its fixture and main's dress rehearsal went red
  # for two days. It can only run here: `scripts/e2e/suites/upgrade.sh` asks for
  # `scripts/e2e/fixtures/<version>/` once the tag is out *and* Cargo.toml has
  # moved past it, so the fixture is impossible to make before the tag and is
  # not demanded until the next bump. A command step, for the same reason
  # `released` is one — an agent step can be carried past by a cleared block.
  # Its following merge step makes landing the fixture the last thing owed.
  #
  # Thirty minutes because it builds the tagged binary to scaffold from, on
  # whatever cache the lane's machine has. Idempotent, so a re-run after a
  # failure costs one lookup when the fixture already landed.
  - id: fixture
    description: Scaffold the released version's upgrade fixture from its own tag and open its pull request.
    run: scripts/release-fixture.sh
    timeout: 30m
    on_pass: merge-fixture
    on_fail: repair-fixture

  - id: repair-fixture
    description: Repair a failed fixture scaffold in one green pull request.
    agent: claude
    prompt: release-fixer
    model: claude-opus-5
    effort: high
    session: true
    loop: 2
    on_pass: merge-fixture-repair

  - id: merge-fixture-repair
    description: Review and merge the fixture machinery repair, then rerun the scaffold.
    agent: claude
    prompt: release-merger
    model: claude-opus-5
    effort: high
    on_pass: fixture

  - id: merge-fixture
    description: Review and merge the generated upgrade fixture so the release leaves main complete.
    agent: claude
    prompt: release-merger
    model: claude-opus-5
    effort: high
    on_pass: done
