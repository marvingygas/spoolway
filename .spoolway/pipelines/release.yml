# Full reference: docs/pipelines.md

description: >-
  Make main release-ready, repair and merge any blockers, then cut, publish and
  verify a spoolway release without waiting for a person.

task_template: default

steps:
  - id: ready
    description: Prove clean main passes the complete local and hosted release-readiness suite.
    agent: claude
    prompt: release-readiness
    model: claude-opus-5
    effort: high
    session: true
    loop:
      fix: 3
    on_loop_max: blocked
    on_pass: preflight
    on_fail: fix

  # Gated, because this step no longer merges. `main` is protected and every pull
  # request is gated on `ci`, so the repair lands when the owner merges it — and
  # an ungated pass would hand a readiness run the same `main` it just failed on,
  # which re-finds the identical blocker and spends a lap of the loop doing it.
  # The pause is where the merge happens.
  - id: fix
    description: Repair every readiness blocker in one pull request and hand its number to the owner to merge.
    agent: claude
    prompt: release-fixer
    model: claude-opus-5
    effort: high
    gate: true
    on_pass: ready
    on_fail: ready

  - id: preflight
    description: Freeze the release candidate and assemble its diff, pull requests, contributors, version and changelog state.
    agent: claude
    prompt: release-preflight
    model: claude-opus-5
    effort: high
    session: true
    loop:
      fix: 3
    on_loop_max: blocked
    on_pass: notes
    on_fail: fix

  - id: notes
    description: Write the one recorded changelog section that ships as the entry, the embedded notes and the release body.
    agent: claude
    prompt: release-notes
    model: claude-sonnet-5
    effort: high
    session: true
    gate: true
    loop:
      notes: 2
    on_loop_max: blocked
    on_pass: publish
    on_fail: notes

  - id: publish
    description: Commit the section with the version bump, rehearse, tag, publish, and verify the published body against it.
    agent: claude
    prompt: release-publisher
    model: claude-opus-5
    effort: high
    loop:
      preflight: 1
    on_loop_max: blocked
    on_pass: released
    on_fail: preflight

  - id: released
    description: Prove the tag, the seven packages, the archives and the published body actually exist.
    run: scripts/release-verify.sh
    timeout: 15m
    on_pass: fixture

  # The closing step of docs/releasing.md, which was prose nobody was gated on
  # until 0.4.0 shipped without its fixture and main's dress rehearsal went red
  # for two days. It can only run here: `scripts/e2e/suites/upgrade.sh` asks for
  # `scripts/e2e/fixtures/<version>/` once the tag is out *and* Cargo.toml has
  # moved past it, so the fixture is impossible to make before the tag and is
  # not demanded until the next bump. A command step, for the same reason
  # `released` is one — an agent step can be carried past by a cleared block,
  # and this is the last thing the release owes.
  #
  # Thirty minutes because it builds the tagged binary to scaffold from, on
  # whatever cache the lane's machine has. Idempotent, so a re-run after a
  # failure costs one lookup when the fixture already landed.
  - id: fixture
    description: Scaffold the released version's upgrade fixture from its own tag and land it on main.
    run: scripts/release-fixture.sh
    timeout: 30m
    on_pass: done
