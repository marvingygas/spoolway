# Full reference: docs/pipelines.md

# >>> spoolway >>>
# Top level
#   version           <x.y>              Yours to raise when this pipeline changed enough
#                                        to compare. spoolway only records it. Absent: 1.0.
#   description       <prose>            What this pipeline is for, in a few sentences.
#                                        Read to choose between pipelines.
#   task_template     <name>             Task skeleton tasks queued here are written from.
#                                        Absent: this pipeline's name, then `default`.
#   steps             <list> <required>  The flow. The first step is the entry, and
#                                        later steps outrank earlier ones for a slot.
#
# Steps
#   id                <name> <required>  Written to the task's `stage:`.
#   description       <one line>         Shown by `spoolway pipeline show`.
#   agent             <profile>          Profile from config.toml. Makes an agent step.
#   run               <command>          Shell line in the worktree. Makes a command step.
#   prompt            <name>             Prompt this step runs.
#                                        Absent: the step id.
#   model             <name>             Model this step runs. Required on an agent step.
#   effort            <string>           Passed to the agent kind's effort flag.
#                                        Blank or absent: no flag is sent.
#   skills            <a, b, c>          Skills invoked at the top of this step's
#                                        opening prompt. Comma separated, leading
#                                        slash optional, names only.
#                                        Absent: none.
#   session           true               Resumes this prompt's earlier conversation.
#                     false <default>    Opens a fresh conversation every visit.
#   slot              true <default>     Consumes one of the profile's slots.
#                     false              Runs without taking one. A model's own
#                                        `slots` applies either way.
#   gate              true               Holds the pass on `paused` for a person.
#                     false <default>    The pass is acted on at once.
#   on_pass           <step id>          Where a pass goes.
#                     done               The task finishes.
#                                        Absent: the task stays put.
#   on_fail           <step id>          Where a failure goes.
#                     blocked <default>  The task parks for a person.
#   loop              <n>                Most arrivals at this step, by any
#                                        route. The next goes to `blocked`.
#                                        Absent: unbounded.
#   timeout           <duration>         How long a command step may run, e.g. `90s`.
#                                        Absent: 30m.
#   background        true               The task moves on; its exit moves nothing.
#                     false <default>    The task waits for the command.
#   headless          true               The command runs detached, with no pane.
#                     false <default>    It runs in a pane of its own.
#   last              true               Only the last task of a chain runs this
#                                        command; the rest walk past to `on_pass`.
#                     false <default>    Every task runs it.
#   first             true               Only a chain's root (no declared
#                                        `depends_on`) runs this command; the
#                                        rest walk past to `on_pass`.
#                     false <default>    Every task runs it.
#   serial            true               One task runs this command at a time; the
#                                        rest wait on the step. Command steps only.
#                     false <default>    Every task runs it on arrival.
# <<< spoolway <<<

description: >-
  Edit a skill spoolway ships, keep every copy of it in step, and hold the new
  text to plain English.

# The pipeline's own name has no task skeleton, so this names the one it uses.
task_template: default

steps:
  - id: edit
    description: Change the shipped skill in every provider's copy, then refresh the installed copies.
    agent: claude
    prompt: skill-editor
    model: claude-sonnet-5-5
    effort: medium
    session: true
    loop: 2
    on_pass: review-spec

  - id: review-spec
    description: Check the change against the task — every acceptance criterion, the mockup, the non-goals.
    agent: claude
    prompt: spec-reviewer
    model: claude-opus-5-5
    effort: high
    session: true
    loop: 4
    on_pass: review-prose
    on_fail: fix-spec

  - id: fix-spec
    description: Clear every finding the spec review raised.
    agent: claude
    prompt: skill-editor
    model: claude-sonnet-5-5
    effort: high
    session: true
    loop: 2
    on_pass: review-spec

  - id: review-prose
    description: Hold every added or changed line to plain English, and every copy to the same meaning.
    agent: claude
    prompt: prose-reviewer
    model: claude-opus-5-5
    effort: high
    session: true
    loop: 4
    on_pass: check
    on_fail: fix-prose

  - id: fix-prose
    description: Clear every finding the prose review raised.
    agent: claude
    prompt: skill-editor
    model: claude-sonnet-5-5
    effort: high
    session: true
    loop: 2
    on_pass: review-prose

  # Reinstalls every copy this repo carries and fails on any diff, so an edit
  # made only to an installed copy cannot reach handover.
  - id: check
    description: Rebuild, reinstall the skill copies, and fail on any drift.
    run: >-
      cargo build --release --locked
      && ./target/release/spoolway install claude --force
      && ./target/release/spoolway install codex --force
      && git diff --exit-code -- .claude/skills .agents/skills
      && cargo test --locked install::
      && ./target/release/spoolway pipeline check
    timeout: 45m
    on_pass: handover
    on_fail: fix-check

  - id: fix-check
    description: Clear what failed the check.
    agent: claude
    prompt: skill-editor
    model: claude-sonnet-5-5
    effort: medium
    session: true
    loop: 2
    on_pass: check

  - id: handover
    description: >-
      Commit, squash, push and open this task's pull request with git and
      `gh` — no model, no rebase. Nothing is merged here; a person lands it.
    run: ./target/release/spoolway stack
    on_pass: done
