# Full reference: docs/pipelines.md

# >>> spoolway >>>
# Top level
#   version           <x.y>              Yours to raise when this pipeline changed enough
#                                        to compare. spoolway only records it. Absent: 1.0.
#   description       <prose>            What this pipeline is for, in a few sentences.
#                                        Read to choose between pipelines.
#   task_template     <name>             Task skeleton tasks queued here are written from.
#                                        Absent: this pipeline's name, then `default`.
#   steps             <list> <required>  The flow. The first step is the entry, and
#                                        later steps outrank earlier ones for a slot.
#
# Steps
#   id                <name> <required>  Written to the task's `stage:`.
#   description       <one line>         Shown by `spoolway pipeline show`.
#   agent             <profile>          Profile from config.toml. Makes an agent step.
#   run               <command>          Shell line in the worktree. Makes a command step.
#   prompt            <name>             Prompt this step runs.
#                                        Absent: the step id.
#   model             <name>             Model this step runs. Required on an agent step.
#   effort            <string>           Passed to the agent kind's effort flag.
#                                        Blank or absent: no flag is sent.
#   skills            <a, b, c>          Skills invoked at the top of this step's
#                                        opening prompt. Comma separated, leading
#                                        slash optional, names only.
#                                        Absent: none.
#   session           true               Resumes this prompt's earlier conversation.
#                     false <default>    Opens a fresh conversation every visit.
#   slot              true <default>     Consumes one of the profile's slots.
#                     false              Runs without taking one. A model's own
#                                        `slots` applies either way.
#   gate              on_pass            Holds a pass on `paused` for a person.
#                     on_fail            Holds a fail on `paused` for a person.
#                     always             Holds a pass or a fail.
#                     Absent: nothing is held. Agent steps only.
#   on_pass           <step id>          Where a pass goes.
#                     done               The task finishes.
#                                        Absent: the task stays put.
#   on_fail           <step id>          Where a failure goes.
#                     blocked <default>  The task parks for a person.
#   loop              <n>                Most arrivals at this step, by any
#                                        route. The next goes to `blocked`.
#                                        Absent: unbounded.
#   timeout           <duration>         How long a command step may run, e.g. `90s`.
#                                        Absent: 30m.
#   background        true               The task moves on; its exit moves nothing.
#                     false <default>    The task waits for the command.
#   hide              true               The command runs detached, with no pane.
#                     false              It runs in a pane of its own, even
#                                        when `dispatch.hide_commands` hides
#                                        commands.
#                                        Absent: follows `dispatch.hide_commands`.
#   last              true               Only the last task of a chain runs this
#                                        step; the rest walk past to `on_pass`.
#                     false <default>    Every task runs it.
#   first             true               Only a chain's root (no declared
#                                        `depends_on`) runs this step; the
#                                        rest walk past to `on_pass`.
#                     false <default>    Every task runs it.
#   serial            true               One task runs this command at a time; the
#                                        rest wait on the step. Command steps only.
#                     false <default>    Every task runs it on arrival.
# <<< spoolway <<<

# 1.1: one review split into `review-spec` and `review-code`, each with its own fixer.
# 1.2: `fix-spec-review` and `fix-code-review` at high effort.
# 1.3: `e2e` on claude-sonnet-5-5, as impl_ui runs it.
version: 1.3

description: >-
  One unit of feature work, start to finish: implement against the acceptance
  criteria, review the diff, carry the change into the end-to-end suites, then
  document and hand over.

# The pipeline's own name has no task skeleton, so this names the one it uses.
task_template: default

steps:
  - id: implement
    description: Write the code to satisfy the task's acceptance criteria.
    agent: claude
    prompt: implementer
    model: claude-sonnet-5-5
    effort: medium
    session: true
    loop: 2
    on_pass: review-spec

  # Two reviews, each with its own fixer. A spec review settles whether the
  # change does what the task asked before a code review spends a pass on how
  # it is built. One review with one fixer sent 71 of 88 tasks back in the
  # 2026-10-02 calibration, and its fixer's `loop` was also spent by the first
  # arrival, so a second failure already went to `blocked`. Each review takes
  # four arrivals: its first, one after each of its fixer's two laps, and one
  # when an unblocker sends its own fix back to be reviewed.
  - id: review-spec
    description: Check the change against the task — every acceptance criterion, the mockup, the non-goals.
    agent: claude
    prompt: spec-reviewer
    model: claude-opus-5-5
    effort: high
    session: true
    loop: 4
    on_pass: review-code
    on_fail: fix-spec-review

  - id: fix-spec-review
    description: Clear every finding the spec review raised.
    agent: claude
    prompt: implementer
    model: claude-sonnet-5-5
    effort: high
    session: true
    loop: 2
    on_pass: review-spec

  - id: review-code
    description: "Review how the change is built: correctness, design, tests and the prose in the source."
    agent: claude
    prompt: code-reviewer
    model: claude-opus-5-5
    effort: high
    session: true
    loop: 4
    on_pass: e2e
    on_fail: fix-code-review

  - id: fix-code-review
    description: Clear every finding the code review raised.
    agent: claude
    prompt: implementer
    model: claude-sonnet-5-5
    effort: high
    session: true
    loop: 2
    on_pass: review-code

  - id: e2e
    description: >-
      Carry this task's change into the end-to-end suites and leave them green,
      while the suites are still cheap to read and fix.
    agent: claude
    prompt: e2e
    model: claude-sonnet-5-5
    effort: medium
    loop: 2
    on_pass: test

  - id: test
    description: The mechanical verdict on this change, as an exit code.
    run: scripts/gate.sh
    timeout: 45m
    on_pass: suite
    on_fail: e2e

  - id: suite
    description: The end-to-end suites, on the last task of the chain.
    last: true
    run: scripts/e2e-pr.sh
    timeout: 45m
    on_pass: screenshots
    on_fail: e2e

  - id: screenshots
    description: File the screenshots e2e captured into docs/screenshots/, one current image per screen.
    agent: claude
    prompt: screenshots
    model: claude-sonnet-5-5
    effort: medium
    on_pass: document

  - id: document
    description: Bring the domain documents in line with what this task changed.
    agent: claude
    prompt: archivist
    model: claude-sonnet-5-5
    effort: high
    on_pass: create-pr

  - id: create-pr
    description: >-
      Push the branch and open this task's pull request with a summary and
      the screenshots its diff changed. Nothing is merged here; a person lands it.
    agent: claude
    prompt: create-pr
    model: claude-haiku-5-5
    on_pass: done
