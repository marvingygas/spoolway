# Full reference: docs/pipelines.md

# >>> spoolway >>>
# Top level
#   description       <prose>            What this pipeline is for, in a few sentences.
#                                        Read to choose between pipelines.
#   task_template     <name>             Task skeleton tasks queued here are written from.
#                                        Absent: this pipeline's name, then `default`.
#   steps             <list> <required>  The flow. The first step is the entry, and
#                                        later steps outrank earlier ones for a slot.
#
# Steps
#   id                <name> <required>  Written to the task's `stage:`.
#   description       <one line>         Shown by `spoolway pipeline show`.
#   agent             <profile>          Profile from config.toml. Makes an agent step.
#   run               <command>          Shell line in the worktree. Makes a command step.
#   end               true               Makes a terminal step: the task stops here.
#                     false <default>    Not an ending.
#   prompt            <name>             Prompt this step runs.
#                                        Absent: the step id.
#   model             <name>             Model this step runs. Required on an agent step.
#   effort            <string>           Passed to the agent kind's effort flag.
#                                        Blank or absent: no flag is sent.
#   skills            <a, b, c>          Skills invoked at the top of this step's
#                                        opening prompt. Comma separated, leading
#                                        slash optional, names only.
#                                        Absent: none.
#   session           true               Resumes this prompt's earlier conversation.
#                     false <default>    Opens a fresh conversation every visit.
#   slot              true <default>     Consumes one of the profile's slots.
#                     false              Runs without taking one. A model's own
#                                        `slots` and `exclusive` apply either way.
#   gate              true               Holds the pass on `paused` for a person.
#                     false <default>    The pass is acted on at once.
#   on_pass           <step id>          Where a pass goes.
#                     done               The task finishes.
#                                        Absent: the task stays put.
#   on_fail           <step id>          Where a failure goes.
#                     blocked <default>  The task parks for a person.
#   loop              <n>                Laps allowed, per arriving step.
#                     <step>: <n>        The same limit, one arriving step at a time.
#                                        Absent: unbounded.
#   on_loop_max       <step id>          Where a spent loop sends the task.
#                     on_pass <default>  It carries on, findings and all.
#   timeout           <duration>         How long a command step may run, e.g. `90s`.
#                                        Absent: 30m.
#   background        true               The task moves on; `on_fail` routes it later.
#                     false <default>    The task waits for the command.
#   headless          true               The command runs detached, with no pane.
#                     false <default>    It runs in a pane of its own.
#   last              true               Only the last task of a chain runs this
#                                        command; the rest walk past to `on_pass`.
#                     false <default>    Every task runs it.
# <<< spoolway <<<


description: >-
  One small change, straight to a pull request. A single strong model does the
  whole change in one step, the mechanical gate proves it, and the branch is
  handed over. No review, no e2e, no archivist — for work small enough that a
  second pair of eyes would only be reading the same diff twice.

# The pipeline's own name has no task skeleton, so this names the one it uses.
task_template: default

steps:
  - id: implement
    description: >-
      Write the whole change to satisfy the task's acceptance criteria, and
      leave it review-ready — nothing downstream will look at the diff.
    agent: claude
    prompt: implementer
    model: claude-opus-5
    effort: high
    session: true
    loop:
      test: 2
    on_loop_max: blocked
    on_pass: test
    on_fail: blocked

  - id: test
    description: The mechanical verdict on this change, as an exit code.
    run: >-
      cargo fmt --check
      && cargo deny check advisories
      && cargo clippy --all-targets --locked -- -D warnings
      && cargo test --all-targets --locked
      && cargo check --target x86_64-pc-windows-gnu --all-targets --locked
      && cargo build --release && ./target/release/spoolway pipeline check
    timeout: 45m
    on_pass: handover
    on_fail: implement

  - id: handover
    description: >-
      Commit, squash, push and open this task's pull request with git and
      `gh` — no model, no rebase. Nothing is merged here; a person lands it.
    run: ./target/release/spoolway stack
    on_pass: done
    on_fail: blocked
