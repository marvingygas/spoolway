# Full reference: docs/pipelines.md

description: >-
  Probes and live checks that produce no outcome in the code: run the check,
  review its evidence, and finish with no handover step, since there is
  nothing to commit or open a pull request for.

steps:
  - id: probe
    description: Run the check the task describes, against the real thing, and record every run as evidence.
    agent: claude
    prompt: prober
    model: claude-opus-5-5
    effort: high
    session: true
    loop: 3
    on_pass: review

  # The reviewer checks the recorded evidence against the acceptance
  # criteria. Its fail sends the findings back to the same probe session.
  # Its pass finishes the task: there is no diff for a code review, a
  # document step or a handover to work from.
  - id: review
    description: Check the recorded evidence against every acceptance criterion.
    agent: claude
    prompt: spec-reviewer
    model: claude-opus-5-5
    effort: high
    session: true
    loop: 3
    on_pass: done
    on_fail: probe
