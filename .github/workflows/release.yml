name: release

# Follow docs/releasing.md: rehearse the release commit with publish=false,
# verify the run's SHA and every required job, then tag that exact commit.
# Both rehearsal and publication require the full shared verification gate.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm and GitHub (unchecked = verify, build and pack only)"
        type: boolean
        default: false

# Never interrupt publication halfway through the seven registry writes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # npm/targets.json is the single source of truth for the platform matrix, so
  # the build fans out from the same file the shim and build script read.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.read.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: read
        run: echo "targets=$(jq -c .targets npm/targets.json)" >> "$GITHUB_OUTPUT"

  # Release checks never consult the daily workflow's skip decision.
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      tier: nightly
      run-tests: true

  # Build platform packages only after the shared verification gate passes.
  build:
    needs: [matrix, verify, notes]
    strategy:
      fail-fast: true
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target.triple }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target.triple }}

      # Statically linked musl builds need the musl gcc wrapper for linking.
      - if: matrix.target.libc == 'musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target.triple }}

      # A Linux file on the release page is promised to start on any distro,
      # so one that quietly linked glibc (a mis-set triple, a changed linker)
      # must stop the release here, before anything is published. `file`
      # reports "statically linked" or "static-pie linked" for the musl
      # builds and "dynamically linked" for a glibc one.
      - name: Check the Linux download is statically linked
        if: matrix.target.download != null && matrix.target.os == 'linux'
        run: |
          bin="target/${{ matrix.target.triple }}/release/spoolway"
          info="$(file -b "$bin")"
          echo "$info"
          case "$info" in
            *"statically linked"*|*"static-pie linked"*) ;;
            *)
              echo "${{ matrix.target.download }} is not statically linked, so it would not start on every distro; build ${{ matrix.target.triple }} with the musl target and the musl-tools linker." >&2
              exit 1
              ;;
          esac

      # `if-no-files-found: error` means a missing binary fails here rather
      # than silently shipping a platform package with nothing in it.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target.triple }}
          path: target/${{ matrix.target.triple }}/release/spoolway
          if-no-files-found: error
          retention-days: 7

  # The GitHub release body is the tagged `CHANGELOG.md` section, never a
  # generated commit list. The same bytes are compiled into the binary by
  # `include_str!`, so the release page and `spoolway whats-new` cannot
  # disagree about what a version shipped. Extracting the section in its own
  # job ahead of `publish` is what makes a missing, duplicated, or mistyped
  # heading fail before the first irreversible npm publish rather than after
  # six packages are already on the registry.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # Rehearsal validates the same changelog section publication will use.
      - name: Extract the release section
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          heading="## $version"

          # Compared as a whole line rather than a regex, so a version whose
          # dots would otherwise act as wildcards cannot match a neighbour,
          # and `## 0.2.0` never matches `## 0.2.01`.
          found="$(awk -v heading="$heading" '
            $0 == heading { total++ }
            END { print total + 0 }
          ' CHANGELOG.md)"
          if [ "$found" != "1" ]; then
            echo "CHANGELOG.md at commit $GITHUB_SHA holds $found sections headed \"$heading\", but the release body requires exactly one; correct the candidate and follow docs/releasing.md before retrying." >&2
            exit 1
          fi

          # A section runs from its own heading to the next `## ` heading. The
          # command substitution drops trailing blank lines, so the file the
          # release body is created from is byte-identical no matter how much
          # whitespace separates one section from the next.
          body="$(awk -v heading="$heading" '
            $0 == heading { inside = 1 }
            inside && /^## / && $0 != heading { inside = 0 }
            inside { print }
          ' CHANGELOG.md)"
          printf '%s\n' "$body" > release-body.md
          cat release-body.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-body
          path: release-body.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [matrix, notes, verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Lands each target's binary at artifacts/<triple>/spoolway, which is where
      # build-npm.mjs looks for them.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - run: node scripts/build-npm.mjs

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./npm/spoolway/package.json').version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $packaged" >&2
            exit 1
          fi

      # A dry run on every path, so a broken package is caught before the first
      # irreversible publish rather than between two of them.
      - name: Pack
        run: |
          for dir in npm/dist/*/*/ npm/spoolway/; do
            echo "--- $dir"
            ( cd "$dir" && npm pack --dry-run )
          done

      # Platform packages go first: spoolway lists them as optionalDependencies,
      # so publishing the wrapper before them leaves a window where installing
      # spoolway resolves nothing to run.
      #
      # Provenance needs a public repo to attest against. This one is public,
      # so the check below passes -- it is kept rather than hardcoded so that a
      # repository turned private later publishes without provenance instead of
      # dying on an opaque OIDC error.
      # A `v` tag is required either way — a `workflow_dispatch` publishes only
      # when it was dispatched against a `v` tag *and* the box was ticked, so a
      # dispatch from `main` can never publish an untagged `Cargo.toml` version
      # past the `Check the tag matches Cargo.toml` step above (gated on the
      # same tag).
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.publish)
        run: |
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            provenance="--provenance"
          else
            provenance=""
            echo "::notice::repository is private; publishing without provenance"
          fi

          # Publishing is seven separate calls to a registry that keeps whatever
          # each one lands, so a failure half way through is a published state
          # nobody chose -- and it happened on the first real release, where the
          # token could write @spoolway/* but not the unscoped wrapper. Skipping
          # a version already on the registry is what makes the rerun that fixes
          # such a thing possible at all: without it the rerun dies on the first
          # package that succeeded last time and never reaches the one that did
          # not. `npm view` exits non-zero on a version that is not there, which
          # is the whole test.
          publish() {
            local name version
            name="$(node -p "require('./package.json').name")"
            version="$(node -p "require('./package.json').version")"

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already published; skipping"
              return 0
            fi

            npm publish --access public $provenance
          }

          for dir in npm/dist/*/*/; do
            ( cd "$dir" && publish )
          done
          ( cd npm/spoolway && publish )
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # npm is how spoolway is meant to be installed; this is the other route --
  # for anyone who wants the binary without a package manager. `install.sh`,
  # stamped with this release's version, is the scripted way: one curl line
  # picks the right bare file, checks it and installs it. The bare executables
  # (one per platform) and SHA256SUMS are attached beside it for a download by
  # hand. Only targets that name a `download` in npm/targets.json are attached
  # (the static Linux builds and macOS), and the file names carry no version, so
  # a link to one never goes stale. It hangs off `publish` rather than `build`
  # so the tag/Cargo.toml check gates it too, and a release is never created for
  # a version npm refused.
  assets:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Artifact downloads drop the executable bit, so the files are made
      # 0755 here to checksum and upload runnable files. A release asset does
      # not keep that mode, though: whoever downloads one must chmod +x it.
      - name: Collect the downloads
        run: |
          mkdir -p dist
          while read -r triple download; do
            install -m 0755 "artifacts/$triple/spoolway" "dist/$download"
          done < <(jq -r '.targets[] | select(.download != null) | "\(.triple) \(.download)"' npm/targets.json)
          # The script is stamped with this release's version so the files it
          # downloads come from this release and never from `latest`.
          sed "s/@SPOOLWAY_VERSION@/${GITHUB_REF_NAME#v}/" scripts/install.sh > dist/install.sh
          chmod 0755 dist/install.sh
          grep -q "^version=\"${GITHUB_REF_NAME#v}\"\$" dist/install.sh
          ( cd dist && sha256sum ./* > SHA256SUMS )
          cat dist/SHA256SUMS

      # `--notes-file` rather than `--generate-notes`: the body is the release
      # record the tag already carries, extracted once by the `notes` job and
      # carried here as an artifact so the page cannot drift from the bytes
      # that job validated. `dist/*` is still the only upload glob, so the
      # notes file is never attached as an asset. `--title` is explicit
      # because a release created without one shows the tagged commit's
      # subject line on the repository page instead of the version.
      - name: Create the release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file artifacts/release-body/release-body.md
        env:
          GH_TOKEN: ${{ github.token }}

  # The formula comes last because it points at the files `assets` uploads and
  # at checksums read back from that release, so it can never name a file that
  # is not there. A failure here leaves npm and the release published without
  # a formula, which is why each error says so. A re-run is safe: the push is
  # skipped when the tap already names this version or a newer one, so an old
  # tag can never replace a newer formula. The install proof runs again for
  # this version, and is skipped when the tap has moved on, because it would
  # install the newer version and fail the version check.
  homebrew:
    needs: assets
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # The token is checked first, before the formula is written or the tap
      # is touched. Only whether it is set is passed in; the push step is the
      # one step that reads its value, and it deletes the clone that holds it
      # before the install step runs.
      - name: Write the formula
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "Error: HOMEBREW_TAP_TOKEN is not set, so the formula was not pushed." >&2
            echo "npm and the GitHub release for $VERSION are already published." >&2
            echo >&2
            echo 'Follow "Homebrew tap setup" in docs/releasing.md, then re-run this job.' >&2
            exit 1
          fi
          published() {
            echo "Error: $1" >&2
            echo "npm and the GitHub release for $VERSION are already published." >&2
            echo "$2" >&2
            exit 1
          }
          gh release download "$VERSION" --pattern SHA256SUMS ||
            published "SHA256SUMS could not be downloaded from the $VERSION release, so the formula was not written." \
              "Check that the assets job uploaded SHA256SUMS, then re-run this job."
          node scripts/write-formula.mjs "${VERSION#v}" SHA256SUMS > spoolway.rb ||
            published "the formula for $VERSION could not be written; the reason is above." \
              "Fix what it names, then re-run this job."
          cat spoolway.rb
        env:
          HAS_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}

      - name: Push it to the tap
        id: push
        run: |
          published() {
            echo "Error: $1" >&2
            echo "npm and the GitHub release for $VERSION are already published." >&2
            echo "$2" >&2
            exit 1
          }
          token_advice="Check that HOMEBREW_TAP_TOKEN can write to marvingygas/homebrew-tap, then re-run this job."
          # The clone keeps the token in tap/.git/config. Removing it on every
          # way out keeps the token off the disk the install step runs on. The
          # path is absolute because the script moves into the clone.
          tap_dir="$PWD/tap"
          trap 'rm -rf "$tap_dir"' EXIT
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/marvingygas/homebrew-tap.git" "$tap_dir" ||
            published "marvingygas/homebrew-tap could not be cloned, so the formula was not pushed." "$token_advice"
          cd "$tap_dir"
          state="$(node ../scripts/tap-state.mjs "${VERSION#v}" Formula/spoolway.rb)" ||
            published "the version in the tap's formula could not be read; the reason is above." \
              "Fix Formula/spoolway.rb in marvingygas/homebrew-tap by hand, then re-run this job."
          case "$state" in
            same)
              echo "The tap already names spoolway ${VERSION#v}, so nothing was pushed."
              exit 0
              ;;
            newer)
              echo "The tap already names a newer spoolway than ${VERSION#v}, so nothing was pushed and the install proof was skipped."
              echo "newer=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          mkdir -p Formula
          cp ../spoolway.rb Formula/spoolway.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/spoolway.rb
          git commit -m "spoolway ${VERSION#v}" ||
            published "the formula for spoolway ${VERSION#v} could not be committed to the tap." \
              "Read the git error above, fix what it names, then re-run this job."
          git push origin HEAD ||
            published "pushing spoolway ${VERSION#v} to marvingygas/homebrew-tap failed." \
              "If the error above says the tap has newer commits, another release pushed first, so re-run this job and it will compare again. Otherwise check that HOMEBREW_TAP_TOKEN can write to marvingygas/homebrew-tap, then re-run this job."
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Installs from the tap the way a person would, so it proves the pushed
      # formula and not the local copy. All three brew checks must pass and
      # the binary must report the tagged version.
      - name: Install it
        if: steps.push.outputs.newer != 'true'
        run: |
          published() {
            echo "Error: $1" >&2
            echo "npm and the GitHub release for $VERSION are already published, and the tap has the formula." >&2
            echo "Fix Formula/spoolway.rb in marvingygas/homebrew-tap, then re-run this job." >&2
            exit 1
          }
          brew install marvingygas/tap/spoolway ||
            published "brew install marvingygas/tap/spoolway failed; its error is above."
          brew test marvingygas/tap/spoolway ||
            published "brew test marvingygas/tap/spoolway failed; its error is above."
          brew audit --strict marvingygas/tap/spoolway ||
            published "brew audit --strict marvingygas/tap/spoolway failed; its findings are above."
          reported="$(spoolway --version)" ||
            published "the brew-installed spoolway did not run."
          if [ "$reported" != "spoolway ${VERSION#v}" ]; then
            published "the brew install reports \"$reported\", not \"spoolway ${VERSION#v}\"."
          fi
