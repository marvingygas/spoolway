name: release

# Follow docs/releasing.md: rehearse the release commit with publish=false,
# verify the run's SHA and every required job, then tag that exact commit.
# Both rehearsal and publication require the full shared verification gate.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm and GitHub (unchecked = verify, build and pack only)"
        type: boolean
        default: false

# Never interrupt publication halfway through the six registry writes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # npm/targets.json is the single source of truth for the platform matrix, so
  # the build fans out from the same file the shim and build script read.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.read.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: read
        run: echo "targets=$(jq -c .targets npm/targets.json)" >> "$GITHUB_OUTPUT"

  # Release checks never consult the daily workflow's skip decision.
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      tier: nightly
      run-tests: true

  # Build platform packages only after the shared verification gate passes.
  build:
    needs: [matrix, verify, notes]
    strategy:
      fail-fast: true
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.triple }}

      # Statically linked musl builds need the musl gcc wrapper for linking.
      - if: matrix.target.libc == 'musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target.triple }}

      # `if-no-files-found: error` means a missing binary fails here rather
      # than silently shipping a platform package with nothing in it.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.triple }}
          path: target/${{ matrix.target.triple }}/release/spoolway
          if-no-files-found: error
          retention-days: 7

  # The GitHub release body is the tagged `CHANGELOG.md` section, never a
  # generated commit list. The same bytes are compiled into the binary by
  # `include_str!`, so the release page and `spoolway whats-new` cannot
  # disagree about what a version shipped. Extracting the section in its own
  # job ahead of `publish` is what makes a missing, duplicated, or mistyped
  # heading fail before the first irreversible npm publish rather than after
  # five packages are already on the registry.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # Rehearsal validates the same changelog section publication will use.
      - name: Extract the release section
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          heading="## $version"

          # Compared as a whole line rather than a regex, so a version whose
          # dots would otherwise act as wildcards cannot match a neighbour,
          # and `## 0.2.0` never matches `## 0.2.01`.
          found="$(awk -v heading="$heading" '
            $0 == heading { total++ }
            END { print total + 0 }
          ' CHANGELOG.md)"
          if [ "$found" != "1" ]; then
            echo "CHANGELOG.md at commit $GITHUB_SHA holds $found sections headed \"$heading\", but the release body requires exactly one; correct the candidate and follow docs/releasing.md before retrying." >&2
            exit 1
          fi

          # A section runs from its own heading to the next `## ` heading. The
          # command substitution drops trailing blank lines, so the file the
          # release body is created from is byte-identical no matter how much
          # whitespace separates one section from the next.
          body="$(awk -v heading="$heading" '
            $0 == heading { inside = 1 }
            inside && /^## / && $0 != heading { inside = 0 }
            inside { print }
          ' CHANGELOG.md)"
          printf '%s\n' "$body" > release-body.md
          cat release-body.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-body
          path: release-body.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [matrix, notes, verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Lands each target's binary at artifacts/<triple>/spoolway, which is where
      # build-npm.mjs looks for them.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - run: node scripts/build-npm.mjs

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./npm/spoolway/package.json').version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $packaged" >&2
            exit 1
          fi

      # A dry run on every path, so a broken package is caught before the first
      # irreversible publish rather than between two of them.
      - name: Pack
        run: |
          for dir in npm/dist/*/*/ npm/spoolway/; do
            echo "--- $dir"
            ( cd "$dir" && npm pack --dry-run )
          done

      # Platform packages go first: spoolway lists them as optionalDependencies,
      # so publishing the wrapper before them leaves a window where installing
      # spoolway resolves nothing to run.
      #
      # Provenance needs a public repo to attest against. This one is public,
      # so the check below passes -- it is kept rather than hardcoded so that a
      # repository turned private later publishes without provenance instead of
      # dying on an opaque OIDC error.
      # A `v` tag is required either way — a `workflow_dispatch` publishes only
      # when it was dispatched against a `v` tag *and* the box was ticked, so a
      # dispatch from `main` can never publish an untagged `Cargo.toml` version
      # past the `Check the tag matches Cargo.toml` step above (gated on the
      # same tag).
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.publish)
        run: |
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            provenance="--provenance"
          else
            provenance=""
            echo "::notice::repository is private; publishing without provenance"
          fi

          # Publishing is six separate calls to a registry that keeps whatever
          # each one lands, so a failure half way through is a published state
          # nobody chose -- and it happened on the first real release, where the
          # token could write @spoolway/* but not the unscoped wrapper. Skipping
          # a version already on the registry is what makes the rerun that fixes
          # such a thing possible at all: without it the rerun dies on the first
          # package that succeeded last time and never reaches the one that did
          # not. `npm view` exits non-zero on a version that is not there, which
          # is the whole test.
          publish() {
            local name version
            name="$(node -p "require('./package.json').name")"
            version="$(node -p "require('./package.json').version")"

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already published; skipping"
              return 0
            fi

            npm publish --access public $provenance
          }

          for dir in npm/dist/*/*/; do
            ( cd "$dir" && publish )
          done
          ( cd npm/spoolway && publish )
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # npm is how spoolway is meant to be installed; this is the manual path --
  # one archive per target on the release page, for anyone who wants the binary
  # without a package manager. It hangs off `publish` rather than `build` so the
  # tag/Cargo.toml check gates it too, and a release is never created for a
  # version npm refused.
  assets:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Artifact downloads drop the executable bit, so the archive has to put it
      # back -- otherwise the tarball unpacks to a file nobody can run.
      - name: Package
        run: |
          mkdir -p dist
          while read -r triple; do
            chmod 0755 "artifacts/$triple/spoolway"
            tar -czf "dist/spoolway-$triple.tar.gz" -C "artifacts/$triple" spoolway
          done < <(jq -r '.targets[].triple' npm/targets.json)
          ( cd dist && sha256sum ./* > SHA256SUMS )
          cat dist/SHA256SUMS

      # `--notes-file` rather than `--generate-notes`: the body is the release
      # record the tag already carries, extracted once by the `notes` job and
      # carried here as an artifact so the page cannot drift from the bytes
      # that job validated. `dist/*` is still the only upload glob, so the
      # notes file is never attached as an asset. `--title` is explicit
      # because a release created without one shows the tagged commit's
      # subject line on the repository page instead of the version.
      - name: Create the release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file artifacts/release-body/release-body.md
        env:
          GH_TOKEN: ${{ github.token }}
