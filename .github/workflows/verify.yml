name: verify

# One definition for daily CI, release rehearsal and tag publication.
# The caller's immutable SHA is used by every job. No publish credentials are needed.
on:
  workflow_call:
    inputs:
      tier:
        description: end-to-end tier (smoke, pr or nightly)
        type: string
        default: nightly
      run-tests:
        description: daily CI may skip tests for a commit already verified
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    timeout-minutes: 45
    if: inputs.run-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # First, because it is the cheapest thing that can fail and the only one
      # whose fix is a single command. There is no rustfmt.toml: the default
      # style is the one nobody had a reason to disagree with.
      - name: formatting
        run: cargo fmt --check

      # herdr-plugin.toml ships to `main` unstamped — scripts/build-npm.mjs
      # only stamps package.json at build time — so its `version` has to be
      # kept equal to Cargo.toml's own by hand, and checked here rather than
      # trusted. This lands in `test` rather than a job of its own beside
      # `verify` in ci.yml: only the jobs of this file (`verify / test`,
      # `verify / audit` and `verify / test-macos`) are required status
      # contexts on `main`, and a sibling job would not gate a merge.
      - name: herdr-plugin.toml version matches Cargo.toml
        run: |
          cargo_version="$(awk -F'"' '/^version *= *"/{print $2; exit}' Cargo.toml)"
          plugin_version="$(awk -F'"' '/^version *= *"/{print $2; exit}' herdr-plugin.toml)"
          if [ "$cargo_version" != "$plugin_version" ]; then
            echo "herdr-plugin.toml version ($plugin_version) does not match Cargo.toml ($cargo_version)" >&2
            exit 1
          fi

      # The tree is kept clippy-clean, so any warning here is new — and a
      # warning nobody is made to look at is one that gets shipped.
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Linux CI never builds the macOS targets it releases, so a warning
      # that only fires there — like a `cfg`-gated variant no non-Linux
      # build constructs — would otherwise first show up on someone's
      # `cargo install`. No macOS SDK is needed: nothing in the dependency
      # tree compiles C on this target.
      - name: clippy (macOS target)
        run: cargo clippy --all-targets --locked --target aarch64-apple-darwin -- -D warnings

      - run: cargo test --all-targets --locked

      - name: validate the end-to-end tier
        env:
          E2E_TIER: ${{ inputs.tier }}
        run: |
          case "$E2E_TIER" in
            smoke|pr|nightly) ;;
            *) echo "Unsupported verification tier: $E2E_TIER" >&2; exit 1 ;;
          esac

      # KEEP leaves each suite's scratch tree behind. It costs nothing on a
      # green run — the runner is thrown away either way — and on a red one it
      # is the difference between debugging a failure and guessing at it.
      - name: end to end
        env:
          KEEP: 1
          E2E_TIER: ${{ inputs.tier }}
        run: |
          cargo build --release --locked
          SPOOLWAY="$PWD/target/release/spoolway" \
            scripts/e2e/run.sh --tier "$E2E_TIER"

      # This repo is developed with the spoolway it builds, so its own
      # `.spoolway/` is a live control plane, not a fixture — the same tree a
      # retired pipeline key once reached main through and stopped the
      # dispatcher loading at all. `pipeline check` is the command for that:
      # it reads the pipeline, its prompts and the config it names, and
      # fails on exactly a control plane that does not load — unlike
      # `doctor`, which also fails a runner that never had herdr or an agent
      # binary on PATH in the first place, for reasons this workflow does
      # not claim to cover. The build above already produced the release
      # binary, so this costs seconds rather than a build of its own.
      - name: check this repo's own control plane still loads
        run: |
          # Every command reads a *claimed* project, and a fresh runner has
          # claimed nothing — `init` is what claims one. It also writes any
          # shipped file this repo does not carry, `pipelines/default.yml`
          # among them, and a scaffolded pipeline with no model on its steps
          # is not this repo's control plane and does not check out. So drop
          # what it added: the checkout is pristine here, which makes
          # "untracked under .spoolway/" exactly "written by the line above".
          # `--yes` because a runner is nobody to answer the confirmation
          # `init` opens with, and unanswered it declines and writes nothing.
          ./target/release/spoolway init --yes
          git clean -fd .spoolway
          git diff --exit-code
          ./target/release/spoolway pipeline check

      # `KEEP: 1` above leaves the run's whole tree at
      # `/tmp/spoolway-e2e-run.<pid>.<random>` (see `run.sh`'s own `mktemp`),
      # and every failing suite's log is copied beside it as
      # `/tmp/spoolway-e2e-fail.<suite>.log`. Collecting both by their fixed
      # prefix is simpler than parsing the `kept:` line, and only happens on a
      # failure. This used to name `/tmp/tmp.*`, which the suites have not
      # written to since the root gained its own prefix, so a red run
      # uploaded nothing and left no evidence behind at all.
      - name: keep the wreckage
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-scratch-${{ inputs.tier }}
          path: |
            /tmp/spoolway-e2e-run.*
            /tmp/spoolway-e2e-fail.*.log
          retention-days: 3
          if-no-files-found: ignore

  # The Mac. Linux CI never runs a line of the macOS code paths — the
  # `cfg`-gated process checks, the `libc` calls that differ — and nobody
  # who works on this repo has a Mac to run them on, so a runner is the only
  # one there is. `verify / test-macos` is a required status context on
  # `main`, so a red run here blocks the merge.
  #
  # Only `command-steps` runs here, not the `pr` tier: it is the suite that
  # starts real processes, sessions and process groups, which is where macOS
  # differs. The rest drives git, the queue and the TUI the same way on any
  # Unix and costs the runner minutes for nothing. The harness needs `setsid`
  # and `flock`, which macOS lacks; it brings perl stand-ins of its own
  # (scripts/e2e/portable.sh). What it still takes from Homebrew is GNU
  # `sed`, `coreutils` and a current `bash`: the suites use `sed -i` with no
  # suffix and `0,/re/` addresses, `timeout`, `date +%N` and `wait -n`, none
  # of which the system tools do. Their unprefixed names go on PATH ahead of
  # the system ones.
  test-macos:
    timeout-minutes: 45
    if: inputs.run-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The scratch trees land under TMPDIR, and macOS's own is a per-user
      # `/var/folders/...` path nobody can name in an upload step. Pinning it
      # makes the artifact path below a fact rather than a guess. A step, not
      # a job `env:`: the `runner` context is not available there.
      - name: GNU tools for the harness
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          brew install bash coreutils gnu-sed
          {
            echo "$(brew --prefix)/bin"
            echo "$(brew --prefix coreutils)/libexec/gnubin"
            echo "$(brew --prefix gnu-sed)/libexec/gnubin"
          } >> "$GITHUB_PATH"

      - run: cargo test --all-targets --locked

      # KEEP leaves the suite's scratch tree behind, for the step below to
      # upload. Nobody can reproduce a red run on a Mac by hand, so the tree
      # is the only evidence there will be.
      #
      # `--jobs 1` streams the suite's output into the log as it runs; with
      # more than one job `run.sh` writes it to a file instead, and a suite
      # that hangs would leave a log with nothing in it. The step's own
      # timeout is shorter than the job's so a hang is cut here, with time left
      # for the upload below — a job cancelled by its own limit skips it.
      - name: command steps, end to end
        timeout-minutes: 25
        env:
          KEEP: 1
        run: |
          cargo build --release --locked
          SPOOLWAY="$PWD/target/release/spoolway" \
            scripts/e2e/run.sh --jobs 1 --suite command-steps

      # `run.sh` leaves the tree at `$TMPDIR/spoolway-e2e-run.<pid>.<random>`,
      # and with `--jobs 1` the suite's log inside it, at
      # `<tree>/command-steps/output.log`. The `no-setsid-bin` tree is
      # left out: it is a symlink to every program on PATH, and the upload
      # fails on the first directory among them it may not read.
      - name: keep the wreckage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scratch-macos
          path: |
            ${{ runner.temp }}/spoolway-e2e-run.*
            !${{ runner.temp }}/spoolway-e2e-run.*/*/no-setsid-bin/**
          retention-days: 3
          if-no-files-found: ignore

  # Advisories change without source changes, so never skip this daily check.
  # Licenses and duplicate versions remain decisions for a person.
  audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
