name: close merged spoolway issues

# Spoolway's `done` event comments "Ready for review in <PR URL>" on the
# task issue and leaves the pull request alone; delivery completes here,
# only after GitHub says that pull request actually merged. A task whose
# branch has no pull request is closed by `github.sh` itself and never
# reaches this workflow. Every run sweeps every open `spoolway:group`
# issue, whatever branch triggered it: one push can merge pull requests
# from several groups within seconds, and the runs GitHub cancels (see
# `concurrency` below) must not take their group down with them.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

# One group for every run of this workflow, not one per branch or pull
# request — closed events from one merge land here within moments of each
# other. `cancel-in-progress: false` keeps a running sweep from being
# cancelled, but GitHub holds at most one pending run per group: a newer
# run replaces an older pending one, so runs may never execute. That is
# harmless only because every run sweeps all open groups, not the group
# its own branch names: the run that survives sees every merged pull
# request, whichever group it belongs to.
concurrency:
  group: spoolway-issues
  cancel-in-progress: false

jobs:
  close-issue:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: close merged child issues in every open group
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);

            // Every open group is swept, not just the one the merged
            // branch names. One push can merge pull requests from many
            // groups, and the single concurrency slot cancels all but one
            // pending run, so a run must not depend on its own group.
            const groups = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'spoolway:group', per_page: 100
            })).filter(issue => !issue.pull_request);

            // The pull request named by a child's own "Ready for review
            // in <PR URL>" comment, the one `github.sh`'s own
            // `hand_off_for_review` posts on `done` — a trusted comment
            // only, the same guard the marker this replaces used to
            // enforce. A child with no such comment, or whose named pull
            // request has not merged, is left open and logged.
            const reviewPr = /Ready for review in\s+https:\/\/github\.com\/([^/\s]+)\/([^/\s]+)\/pull\/(\d+)/i;
            async function mergedReviewPr(issueNumber) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {owner, repo, issue_number: issueNumber, per_page: 100}
              );
              for (const comment of comments.reverse()) {
                if (!trusted.has(comment.author_association)) continue;
                const found = comment.body?.match(reviewPr);
                if (!found) continue;
                if (found[1].toLowerCase() !== owner.toLowerCase() ||
                    found[2].toLowerCase() !== repo.toLowerCase()) continue;
                return Number(found[3]);
              }
              return undefined;
            }

            async function closeIssue(issueNumber, mergedPrNumber) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `**spoolway:** merged in #${mergedPrNumber}.`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issueNumber,
                state: 'closed', state_reason: 'completed'
              });
              for (const label of ['spoolway:in-progress', 'spoolway:review']) {
                try {
                  await github.rest.issues.removeLabel({owner, repo, issue_number: issueNumber, name: label});
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }

            async function sweepGroup(groupNumber) {
              const children = await github.paginate(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues',
                {owner, repo, issue_number: groupNumber, per_page: 100}
              );

              for (const child of children) {
                if (child.state === 'closed') continue;
                const prNumber = await mergedReviewPr(child.number);
                if (!prNumber) {
                  core.notice(`#${child.number} has no trusted "Ready for review in" comment — leaving it open`);
                  continue;
                }
                const candidate = await github.rest.pulls.get({owner, repo, pull_number: prNumber});
                if (!candidate.data.merged) {
                  core.notice(`#${child.number}'s pull request #${prNumber} has not merged — leaving it open`);
                  continue;
                }
                await closeIssue(child.number, prNumber);
              }

              const stillOpen = await github.paginate(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues',
                {owner, repo, issue_number: groupNumber, per_page: 100}
              );
              if (!stillOpen.length || stillOpen.some(child => child.state !== 'closed')) return;

              // The group's comment names a pull request from its own
              // children: the triggering one may belong to another group.
              // Children closed in an earlier run are read again here, so
              // the group still closes when this run closed none of them.
              let groupPr;
              for (const child of stillOpen.reverse()) {
                groupPr = await mergedReviewPr(child.number);
                if (groupPr) break;
              }
              if (!groupPr) {
                core.notice(`#${groupNumber}'s children name no pull request — leaving it open`);
                return;
              }
              await closeIssue(groupNumber, groupPr);
            }

            // One group failing must not stop the others, since a surviving
            // run may be the only one to sweep them.
            const failed = [];
            for (const group of groups) {
              try {
                await sweepGroup(group.number);
              } catch (error) {
                failed.push(group.number);
                core.error(`sweeping #${group.number} failed: ${error.message}`);
              }
            }
            if (failed.length) core.setFailed(`could not sweep ${failed.map(n => '#' + n).join(', ')}`);
