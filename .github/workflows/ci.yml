name: ci

# Daily integration checks on main; pushes, pull requests and stacks start no run.
# Local pipeline gates still validate each task and the top of each chain.
# Successful scheduled checks are reused only for the same commit. Advisories
# refresh every day even when source is unchanged; manual runs always run all jobs.
# Standard hosted runners are free for this public repository. Keep artifacts
# short-lived because storage has its own allowance.

on:
  schedule:
    # 03:17 UTC: 05:17 Berlin in summer, 04:17 in winter.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: which e2e tier to run
        type: choice
        options: [smoke, pr, nightly]
        default: nightly

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      test: ${{ steps.check.outputs.test }}
    steps:
      - name: check whether this commit already passed a daily run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          passed=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f event=schedule -f status=success -f head_sha="$GITHUB_SHA" \
            -f per_page=1 --jq '.total_count')
          if [ "$passed" -gt 0 ]; then
            echo "test=false" >> "$GITHUB_OUTPUT"
            echo "This commit already passed daily CI; only advisories need refreshing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "test=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # First, because it is the cheapest thing that can fail and the only one
      # whose fix is a single command. There is no rustfmt.toml: the default
      # style is the one nobody had a reason to disagree with.
      - name: formatting
        run: cargo fmt --check

      # The tree is kept clippy-clean, so any warning here is new — and a
      # warning nobody is made to look at is one that gets shipped.
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo test --all-targets --locked

      # KEEP leaves each suite's scratch tree behind. It costs nothing on a
      # green run — the runner is thrown away either way — and on a red one it
      # is the difference between debugging a failure and guessing at it.
      - name: end to end
        env:
          KEEP: 1
          E2E_TIER: ${{ inputs.tier || 'nightly' }}
        run: |
          cargo build --release --locked
          SPOOLWAY="$PWD/target/release/spoolway" \
            scripts/e2e/run.sh --tier "$E2E_TIER"

      # This repo is developed with the spoolway it builds, so its own
      # `.spoolway/` is a live control plane, not a fixture — the same tree a
      # retired pipeline key once reached main through and stopped the
      # dispatcher loading at all. `pipeline check` is the command for that:
      # it reads the pipeline, its prompts and the config it names, and
      # fails on exactly a control plane that does not load — unlike
      # `doctor`, which also fails a runner that never had herdr or an agent
      # binary on PATH in the first place, for reasons this workflow does
      # not claim to cover. The build above already produced the release
      # binary, so this costs seconds rather than a build of its own.
      - name: check this repo's own control plane still loads
        run: ./target/release/spoolway pipeline check

      # The suites keep their trees under a mktemp root and print it; collecting
      # the lot is simpler than parsing for it, and only happens on a failure.
      - name: keep the wreckage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scratch-${{ inputs.tier || 'nightly' }}
          path: /tmp/tmp.*
          retention-days: 3
          if-no-files-found: ignore

  # Advisories change without source changes, so never skip this daily check.
  # Licenses and duplicate versions remain decisions for a person.
  audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # Windows is a supported target, and the parts of spoolway that differ there
  # are exactly the parts a Linux run cannot exercise: the PowerShell dialect
  # typed at a pane, the PATHEXT lookup, the `.cmd` shim, and the process check
  # standing in for /proc. Building it is not enough — those have to run.
  #
  # No e2e here: the suites are bash, and what they cover is platform-neutral.
  # What is platform-specific is in the unit tests.
  test-windows:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Every unit test whose behaviour forks on the platform — the PowerShell
      # dialect, the PATHEXT lookup, the `.cmd` shim, the process check.
      - run: cargo test --all-targets --locked
