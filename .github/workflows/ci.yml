name: ci

# Pull requests run the `pr` tier; `main` gets the full nightly tier once a day.
# Local pipeline gates still validate each task and the top of each chain.
# Successful scheduled checks are reused only for the same commit. Advisories
# refresh every day even when source is unchanged; manual runs always run all jobs.
# Standard hosted runners are free for this public repository. Keep artifacts
# short-lived because storage has its own allowance.

on:
  # Per-push checks were dropped once (672cc51) and per-PR checks went with them.
  # What followed is the reason they are back: four pull requests merged on
  # 2026-09-15 with `test` and `test-windows` both red, main stayed broken, and
  # the release pipeline was the first thing that refused to carry on — which is
  # an expensive place to learn it. A pull request is the cheapest gate there is.
  pull_request:
    branches: [main]
  schedule:
    # 03:17 UTC: 05:17 Berlin in summer, 04:17 in winter.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: which e2e tier to run
        type: choice
        options: [smoke, pr, nightly]
        default: nightly

# A pull request supersedes its own earlier run. A dispatch never cancels
# another: the release pipeline dispatches this workflow against `main` once per
# readiness pass, and under one shared `ci-main` group the second dispatch
# cancelled the first — which a readiness step reads as a failed gate on a
# candidate that was never actually tested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      test: ${{ steps.check.outputs.test }}
    steps:
      - name: check whether this commit already passed a daily run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          passed=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f event=schedule -f status=success -f head_sha="$GITHUB_SHA" \
            -f per_page=1 --jq '.total_count')
          if [ "$passed" -gt 0 ]; then
            echo "test=false" >> "$GITHUB_OUTPUT"
            echo "This commit already passed daily CI; only advisories need refreshing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "test=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    # A lookup failure must not suppress the advisory check or test execution.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/verify.yml
    with:
      # A pull request pays for the `pr` tier; `main` and any explicit dispatch
      # get the full nightly one. scripts/e2e/run.sh's own header calls `pr`
      # "what every push and every pull request runs" — this is that.
      tier: ${{ inputs.tier || (github.event_name == 'pull_request' && 'pr' || 'nightly') }}
      run-tests: ${{ needs.changes.outputs.test != 'false' }}
