name: ci

# Daily integration checks on main; pushes, pull requests and stacks start no run.
# Local pipeline gates still validate each task and the top of each chain.
# Successful scheduled checks are reused only for the same commit. Advisories
# refresh every day even when source is unchanged; manual runs always run all jobs.
# Standard hosted runners are free for this public repository. Keep artifacts
# short-lived because storage has its own allowance.

on:
  schedule:
    # 03:17 UTC: 05:17 Berlin in summer, 04:17 in winter.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: which e2e tier to run
        type: choice
        options: [smoke, pr, nightly]
        default: nightly

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      test: ${{ steps.check.outputs.test }}
    steps:
      - name: check whether this commit already passed a daily run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          passed=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f event=schedule -f status=success -f head_sha="$GITHUB_SHA" \
            -f per_page=1 --jq '.total_count')
          if [ "$passed" -gt 0 ]; then
            echo "test=false" >> "$GITHUB_OUTPUT"
            echo "This commit already passed daily CI; only advisories need refreshing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "test=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    # A lookup failure must not suppress the advisory check or test execution.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/verify.yml
    with:
      tier: ${{ inputs.tier || 'nightly' }}
      run-tests: ${{ needs.changes.outputs.test != 'false' }}
