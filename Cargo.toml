[package]
name = "spoolway"
version = "0.4.0"
edition = "2024"
description = "Descriptive agent workflow builder run by a minimalistic command line state machine for turning coding agents into a pipeline you can actually reason about"
license = "MIT"
readme = "README.md"
keywords = ["agent", "pipeline", "dispatcher", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The maintained fork of serde_yaml, which was archived by its author
# (RUSTSEC-2024-0320). API-identical at 0.9; the swap is the import name.
serde_norway = "0.9"
terminal_size = "0.4.4"
toml = "0.8"
toml_edit = "0.22"
# WHATWG-URL parsing, for validating the `url=` a tracker hook answers on the
# `open` event — see `queue::is_absolute_http_url`. A hand-rolled authority
# scan kept leaking malformed IPv6 literals and out-of-range ports.
url = "2"

[profile.release]
strip = true

# For one syscall: signalling a process group. It was `Command::new("kill")`
# until a procps that rejects a bare negative pid made `stop` a no-op on one
# distro and not another — see `headless::kill_group`.
[target."cfg(unix)".dependencies]
libc = "0.2"

# Linux answers `repo::process_cwd_under` for itself by reading `/proc`
# directly, same as `lock::is_running`/`lock::started_at` do — no need for
# this here. macOS has no equivalent file to read: a process's cwd is a
# libproc (`proc_pidinfo`) call, and hand-rolling it risks getting a
# live-work check silently wrong on a platform this checkout never runs its
# own tests on. `sysinfo` already carries it, audited and exercised far more
# than a first attempt here would be.
[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
