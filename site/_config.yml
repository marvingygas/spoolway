title: spoolway
tagline: Run coding agents as a pipeline you can reason about
description: >-
  spoolway is a command-line state machine that drives coding agents through
  defined pipelines. A dispatcher with no model in it: every scheduling decision
  is a counter, a timestamp, or a position in the pipeline file. A git worktree
  per task, stacked pull requests, and any mix of local and cloud models.
url: https://marvingygas.github.io
baseurl: /spoolway
repository: marvingygas/spoolway
lang: en

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-sitemap

exclude:
  - build.sh
